<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>ANG HR Basic｜登入</title>
  <link rel="manifest" href="manifest.webmanifest">
  <style>
:root{
  --accent:#FF87E0;
  --accent2:#59DDFF;
  --accent-soft:rgba(255,135,224,.14);
  --bg:#f6f7fb;
  --card:#ffffff;
  --text:#111827;
  --muted:#6b7280;
  --line:#e5e7eb;
  --shadow:0 16px 40px rgba(15,23,42,.08);
  --radius:26px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Arial,sans-serif;color:var(--text);background:radial-gradient(circle at 16% 0%,rgba(255,135,224,.08),transparent);}
body{padding-bottom:96px;}
button,input,select,textarea{font:inherit;}
button{cursor:pointer;}
.app-shell{width:min(1080px,100%);margin:0 auto;padding:18px 16px 28px;}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;}
.brand{display:flex;align-items:center;gap:12px;min-width:0;}
.logo-mark{width:46px;height:46px;border-radius:18px;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 14px 28px rgba(15,23,42,.14);display:grid;place-items:center;color:#fff;font-weight:900;font-size:20px;}
.brand h1{font-size:20px;line-height:1.12;margin:0;font-weight:950;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.brand p{margin:3px 0 0;color:var(--muted);font-size:12px;font-weight:800;}
.pill{border:1px solid rgba(17,24,39,.08);background:rgba(255,255,255,.72);backdrop-filter:blur(12px);border-radius:999px;padding:9px 12px;font-size:12px;font-weight:950;color:#374151;white-space:nowrap;}
.hero{position:relative;overflow:hidden;border-radius:32px;padding:24px 20px;background:linear-gradient(135deg,#fff 0%,#f7f8ff 56%,rgba(255,255,255,.92) 100%);box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.5);margin-bottom:14px;}
.hero:after{content:"";position:absolute;right:-46px;top:-46px;width:160px;height:160px;border-radius:999px;background:linear-gradient(135deg,rgba(255,135,224,.32),rgba(89,221,255,.25));}
.hero h2{position:relative;margin:0 0 8px;font-size:30px;line-height:1.15;font-weight:950;letter-spacing:-.03em;}
.hero .sub{position:relative;color:var(--muted);line-height:1.65;font-size:14px;font-weight:700;max-width:720px;}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;}
.card{background:rgba(255,255,255,.86);border:1px solid rgba(255,255,255,.9);box-shadow:var(--shadow);border-radius:var(--radius);padding:18px;min-width:0;}
.card-title{font-size:16px;font-weight:950;margin:0 0 12px;display:flex;align-items:center;gap:8px;}
.form-row{display:grid;gap:8px;margin-bottom:12px;}
.form-row label{font-size:12px;color:#6b7280;font-weight:950;}
.input{width:100%;border:1px solid var(--line);border-radius:18px;padding:13px 14px;background:#fff;font-weight:850;outline:none;}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;}
.btn{border:0;border-radius:18px;background:#111827;color:#fff;padding:12px 15px;font-weight:950;font-size:14px;box-shadow:0 12px 24px rgba(15,23,42,.14);width:100%;}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));}
.btn.gray{background:#f3f4f6;color:#111827;box-shadow:none;}
.btn:disabled{opacity:.55;cursor:not-allowed;}
.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);max-width:calc(100% - 28px);padding:12px 14px;border-radius:18px;background:#111827;color:#fff;font-size:13px;font-weight:850;z-index:100;animation:slideUp .3s ease;}
@keyframes slideUp{from{transform:translateX(-50%) translateY(100px);opacity:0;}to{transform:translateX(-50%) translateY(0);opacity:1;}}
@media(max-width:420px){.hero h2{font-size:24px}.app-shell{padding:14px 12px 28px;}}
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="logo-mark">A</div>
        <div>
          <h1>ANG HR Basic</h1>
          <p id="versionName">入門版｜GitHub Pages 前端</p>
        </div>
      </div>
      <div class="pill">入門版</div>
    </header>

    <section class="grid">
      <div class="card" style="grid-column:span 12;">
        <div class="card-title">🔐 員工登入</div>
        <form id="loginForm">
          <div class="form-row">
            <label>員工編號</label>
            <input class="input" id="loginId" autocomplete="username" placeholder="員工編號" required>
          </div>
          <div class="row">
            <button class="btn primary" type="submit" style="flex:1;">登入員工首頁</button>
            <button class="btn gray" type="button" id="clearBtn" style="flex:1;">清除登入</button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <div id="toast" class="toast"></div>
  <script src="config.js"></script>
  <script src="assets/auth.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/js_idle.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e){
      e.preventDefault();
      var id = (document.getElementById('loginId').value || '').trim().replace(/[^A-Za-z0-9_-]/g,'').toUpperCase();
      if (!id) { alert('請輸入員工編號'); return; }
      
      var auth = window.ANG_HR_AUTH || window.ANGAuth;
      if (auth && auth.saveLogin) {
        auth.saveLogin({ id:id, name:id, token:'' });
        setTimeout(function(){
          if (auth && auth.goPage) {
            auth.goPage('employee_home.htm');
          } else {
            var url = new URL('employee_home.htm', window.location.href);
            url.searchParams.set('id', id);
            url.searchParams.set('plan', 'basic');
            url.searchParams.set('source', 'web');
            url.searchParams.set('v', Date.now());
            location.href = url.toString();
          }
        }, 250);
      }
    });

    document.getElementById('clearBtn').addEventListener('click', function(){
      var auth = window.ANG_HR_AUTH || window.ANGAuth;
      if (auth && auth.clear) auth.clear();
      document.getElementById('loginId').value = '';
      alert('已清除登入資料');
    });

    (function preload(){
      var auth = window.ANG_HR_AUTH || window.ANGAuth;
      var u = auth && auth.getUser ? auth.getUser() : null;
      if (u && u.id) document.getElementById('loginId').value = u.id;
    })();
  </script>
</body>
</html>
